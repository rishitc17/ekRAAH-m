<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ekRAAH Mobile Demo</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0f1117;
}

body {
    display: grid;
    place-items: center;
}

.phone {
    height: 95vh;
    aspect-ratio: 390 / 844;

    background: #111;
    border-radius: 50px;
    padding: 12px;

    position: relative;

    box-shadow:
        0 30px 80px rgba(0,0,0,.45),
        0 0 0 2px #2a2a2a;
}

.screen {
    width: 100%;
    height: 100%;
    overflow: hidden;
    border-radius: 40px;
    background: white;
}

iframe {
    width: 100%;
    height: 100%;
    border: none;
}
</style>
</head>

<body>

<div class="phone">
    <div class="screen">
        <iframe
            src="https://rishitc17.github.io/ekRAAH/"
            loading="eager">
        </iframe>
    </div>
</div>

</body>
</html>
